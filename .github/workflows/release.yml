name: release

on:
  # The GitHub release is created from releases/proto-N.md by hand (see
  # RELEASING.md); publishing it is what builds and pushes the images a host
  # deploys.
  release:
    types: [published]
  # Only when this file changes: builds both images for every platform without
  # pushing, so a change to the release build is tested before a release needs it.
  pull_request:
    paths: ['.github/workflows/release.yml']

jobs:
  image:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: promptle
          - name: frontend
            context: promptle-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # arm64 for the Mac LAN host, amd64 for the Ubuntu one. Both Dockerfiles
      # build on $BUILDPLATFORM, so only the runtime stage runs under emulation.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag release-proto-6 -> image proto-6, and latest. The source label it adds
      # is what links the package to this repository on GHCR.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/promptle-${{ matrix.name }}
          tags: |
            type=match,pattern=^release-(proto-.+)$,group=1
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
